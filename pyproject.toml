[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "squares-vault"
version = "0.1.0"
description = "SQUARES Vault – personal life-admin Telegram bot"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "cryptography>=43",
    "argon2-cffi>=23",
    "Pillow>=10",
    "pymupdf>=1.24",
    "dateparser>=1.2",
    "python-ulid>=2.0",
    "python-dotenv>=1.0",
    "structlog>=24",
    "boto3>=1.35",
    "aioboto3>=13",
    "zstandard>=0.23",
    "anyio>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-python-dateutil",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "ANN", "S", "TCH"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/squares_vault --cov-report=term-missing"
